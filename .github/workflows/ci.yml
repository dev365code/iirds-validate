name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday morning: check whether plusmeta has changed the rule catalogue.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.3
      - run: ruff check .

      # The generated rule tables must match what the generator produces from
      # the pinned catalogue. A hand-edit to schema_tables.py would otherwise
      # survive until someone reran the generator and silently lost it.
      - run: pip install -e .
      - run: python tools/propose_class_rules.py --check

      - name: no rule claims a version whose vocabulary it predates
        # Every `versions` array came from the reference tool. A rule applicable
        # to a release whose ontology lacked its class runs, matches nothing and
        # reports clean, so the error is in the claim rather than the output.
        run: python tools/version_inventory.py

      - name: the specification index is internally consistent
        run: |
          python tools/extract_requirements.py
          python tools/requirement_coverage.py

      - name: the emitted SHACL shapes still match their generator
        run: python tools/emit_shacl.py --check

      - name: the shapes agree with the Python rules, rule for rule
        # pySHACL rides only on this row; the matrix rows skip via
        # importorskip. Full differential parity: per-rule mutants, the
        # handover removals, the calibration anchor, and the entire vendored
        # corpus in both encodings. Pinned to a minor: the gate's claims are
        # "tested on pySHACL 0.40", and an engine that silently changes under
        # us is the one failure mode a differential gate cannot see.
        env:
          # The one row that has pySHACL is the one row where its absence must
          # be a failure. Without this an install that quietly fails leaves the
          # differential gate skipping and the job green -- which is the shape
          # of green this variable exists to remove.
          IIRDS_REQUIRE_SHACL: "1"
        run: |
          pip install pytest "pyshacl==0.40.*"
          pytest -q tests/test_shapes_static.py tests/test_shapes_parity.py

  test:
    name: py${{ matrix.python }} ${{ matrix.label }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          # pyproject declares rdflib>=6, so 6.0.0 exactly is what this row
          # runs: a floor test that floats upward stops testing the floor. The
          # floor and this pin move together or the promise is untested.
          - { os: ubuntu-latest, python: "3.9", pin: "rdflib==6.0.0", label: "rdflib floor" }
          # Windows is where an unclosed ZIP handle keeps files locked and where
          # the .gitattributes eol=lf setting gets tested. macOS is here
          # because README.md names it: a platform this says it runs on and
          # never runs on is a claim held by nobody. It is also the other
          # case-insensitive filesystem, which is what L12 is about.
          - { os: windows-latest, python: "3.11" }
          - { os: macos-latest, python: "3.11" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - if: matrix.pin
        run: pip install "${{ matrix.pin }}"
      - run: python -c "import rdflib, sys; print('rdflib', rdflib.__version__, 'on', sys.version)"
      - run: pytest -q

      - name: no rule has quietly stopped firing
        # pytest records which rules produced a finding; this compares that
        # against docs/rule-coverage.json. A rule that fires nowhere is not
        # known to work, and the count must not grow without somebody saying so.
        run: python tools/rule_coverage.py --check

  wheel:
    # The failure this job exists for: a wheel that builds and installs but is
    # missing data/ontologies/, so the tool works from a checkout and dies on a
    # user's machine. Nothing in the test suite would notice.
    name: installed wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build --wheel --outdir dist/

      - name: the sdist carries no working notes
        # Built into its own directory so the wheel checks below keep seeing
        # exactly one file under dist/.
        run: |
          python -m build --sdist --outdir dist/sdist/
          if tar tzf dist/sdist/*.tar.gz | sed -E 's#^[^/]+/##' \
             | grep -qE '^(CLAUDE\.md|AGENTS\.md|\.claude/|docs/findings\.md|docs/audits\.md)$'; then
            echo "working notes in the sdist"; exit 1
          fi

      - name: the wheel must carry the ontologies and the catalogue
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          names = set(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())
          required = [
              "iirds_validate/data/rule-catalog.json",
              "iirds_validate/data/ontologies/sha256sums.txt",
              "iirds_validate/data/ontologies/1.3/iirds-core.rdf",
              "iirds_validate/data/ontologies/1.3/iirds-handover.rdf",
              "iirds_validate/data/ontologies/1.3/iirds-machinery.rdf",
              "iirds_validate/data/ontologies/1.3/iirds-software.rdf",
              "iirds_validate/data/web/page.html",
              "iirds_validate/data/web/style.css",
              "iirds_validate/data/web/app.js",
              "iirds_validate/data/web/i18n.json",
              "iirds/__init__.py",
              "iirds/_metadata.py",
              "iirds/_pack.py",
              "iirds/_package.py",
          ]
          missing = [n for n in required if n not in names]
          if missing:
              sys.exit("missing from the wheel: %s" % missing)

          # And the reference corpus must NOT be here. It is 4 MB of test
          # material that no user needs, and the whole argument for the .pyz is
          # that what you carry across an air gap is the smallest thing that
          # does the job.
          strays = sorted(n for n in names
                          if "corpus" in n
                          or (n.endswith(".rdf")
                              and not n.startswith("iirds_validate/data/ontologies/")))
          if strays:
              sys.exit("the wheel carries material it should not: %s" % strays[:5])
          print("all %d required data files present, and no test corpus" % len(required))
          PY

      - name: install into a clean environment
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet dist/*.whl
          /tmp/v/bin/iirdsv --version
          /tmp/v/bin/iirds --version
          /tmp/v/bin/iirds-validate --version
          /tmp/v/bin/python -c "import iirds, iirds_validate; assert iirds.__version__ == iirds_validate.__version__"

      - name: the compatibility names install beside the wheel and own no file of it
        # `iirds-validate` and `iirds-sdk` keep the old names resolving. Each
        # depends on `iirds` and carries nothing of it; a file owned by two
        # distributions is how an uninstall of one breaks the other.
        run: |
          python -m build --wheel --outdir dist/shims/ shims/iirds-validate
          python -m build --wheel --outdir dist/shims/ shims/iirds-sdk
          /tmp/v/bin/pip install --quiet --no-index --find-links dist/ --find-links dist/shims/ iirds-validate iirds-sdk
          /tmp/v/bin/pip check
          /tmp/v/bin/python tools/shim_overlap.py
          /tmp/v/bin/python -c "import iirds_sdk; assert iirds_sdk.__version__ == __import__('iirds').__version__"

      - name: the vendored ontologies must be intact after install
        run: /tmp/v/bin/python -m iirds_validate.ontology --verify

      - name: build fixture containers
        run: |
          python tools/make_fixture_package.py fixtures/good.iirds
          python tools/make_fixture_package.py fixtures/bad.iirds --broken missing-format
          python tools/make_fixture_package.py fixtures/desc.iirds --broken description-style

      - name: validate them with the installed console script
        run: |
          /tmp/v/bin/iirdsv check fixtures/good.iirds
          /tmp/v/bin/iirdsv check fixtures/desc.iirds   # rdf:Description style must also pass
          /tmp/v/bin/iirdsv check fixtures/good.iirds --format json | python -m json.tool > /dev/null

      - name: exit codes must mean what the README says
        run: |
          set +e
          /tmp/v/bin/iirdsv check fixtures/good.iirds -q; test $? -eq 0 || exit 1
          /tmp/v/bin/iirdsv check fixtures/bad.iirds  -q; test $? -eq 1 || exit 1
          /tmp/v/bin/iirdsv check /no/such/file.iirds -q 2>/dev/null; test $? -eq 2 || exit 1
          echo "0 clean / 1 findings / 2 could not run"

      - name: agreement with the reference tool's own corpus
        # Offline now, because the corpus is vendored at the catalogue's own
        # revision. This used to be a scheduled job piped through `|| true`, so
        # nothing would ever have noticed the agreement figures decaying.
        #
        # --check compares every rule/fixture pair against docs/agreement.json
        # and fails on any movement in either direction. Not a target and not a
        # score: a pair going from agree to silent is a regression, and one
        # going the other way still wants somebody to say why. explain_silence
        # is informational — its classifier is not strong enough to gate on,
        # which docs/divergences.md says in as many words.
        run: |
          /tmp/v/bin/python tools/vendor_corpus.py --check
          /tmp/v/bin/python tools/crossvalidate.py --check
          /tmp/v/bin/python tools/explain_silence.py --quiet

      - name: the central claim, on a real container
        # Same graph written four ways must produce the same findings. This is
        # the project's whole argument and was previously only ever run by hand.
        #
        # On the defective container above all, and not only the clean one: four
        # identical empty reports agree with each other no matter how badly the
        # tool is broken. The run against good.iirds says the rewriting itself
        # introduces no defect; the run against bad.iirds is the one that says
        # the findings survive a change of syntax.
        run: |
          /tmp/v/bin/python tools/serialisation_equivalence.py fixtures/bad.iirds
          /tmp/v/bin/python tools/serialisation_equivalence.py fixtures/good.iirds --allow-clean

      - name: the single-file form must work with nothing installed
        # `python -S` skips site-packages, so anything that runs came out of
        # the archive. The directory holds a deliberately broken package, so
        # exit 1 there is the correct answer and not a failure of this step.
        run: |
          set +e
          python tools/build_zipapp.py --check || exit 1
          python -S dist/iirds.pyz fixtures/good.iirds -q
          test $? -eq 0 || { echo "a good package should exit 0"; exit 1; }
          python -S dist/iirds.pyz fixtures/ -q
          test $? -eq 1 || { echo "a directory with a broken package should exit 1"; exit 1; }
          echo "single-file form: one good package 0, a directory with a bad one 1"

      - name: no network access during validation
        run: |
          /tmp/v/bin/python - <<'PY'
          import iirds                              # import both first, then cut the network
          from iirds_validate import runner
          import socket
          def refuse(*a, **k):
              raise AssertionError("the validator attempted a network connection")
          socket.socket = refuse
          socket.create_connection = refuse
          report = runner.run("fixtures/good.iirds", runner.ALL_KINDS)
          assert report.checked > 40, report.checked
          print("%d rules ran with the network disabled" % report.checked)
          PY

  upstream-catalogue:
    # Advisory. plusmeta actively maintains their rule set; this says so out
    # loud instead of letting the pinned catalogue quietly go stale.
    name: upstream rule catalogue
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: has plusmeta changed the rules since the pinned commit?
        run: python tools/extract_catalog.py --ref master --check

      - run: pip install -e .

      - name: has the fixture corpus moved since the pinned commit?
        # The only thing left here that genuinely needs the network. Both the
        # catalogue and the corpus are pinned and vendored, so the question is
        # no longer "what do we score" — the main pipeline answers that
        # offline, on every push — but "has upstream changed underneath the
        # pin", which is a decision for a person, not a build failure.
        run: |
          python tools/vendor_corpus.py --retrieved "$(date -u +%Y-%m-%d)"
          git diff --stat -- tests/corpus/plusmeta || true
