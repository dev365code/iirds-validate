# Runs when a version tag is pushed. Proves the tree green, builds the three
# distributions and the single file, proves this runner's two builds of the
# .pyz agree -- which is determinism on one machine, not the whole claim --
# attaches everything to a GitHub Release with the checksums beside
# it -- for the air-gapped audience, "the hash on the release page is the hash
# of the file I carried in" is the entire trust story -- and then publishes
# the same bytes to PyPI, `iirds` first so that the two compatibility names
# can resolve the moment they land.
name: release

on:
  push:
    tags: ["v*"]
  # A tag is the only thing that publishes. This runs the same build job on
  # demand so that a change to the gates can be proved against this workflow
  # *before* a tag is pushed: the first tag of 0.7.0 failed here, in the one
  # job no push had ever exercised, and the publish jobs below never ran.
  # Every one of them is `if: github.event_name == 'push'`, so a dispatch
  # cannot publish whatever it is given.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # This job runs this project's build scripts and its suite. It makes the
      # bytes; it does not get to publish them, so it cannot move a release if
      # something reaches it. `publish-release` below holds that permission and
      # does nothing else. tests/test_workflow_supply_chain.py holds the line.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          # `make check` below runs the suite, and the suite reads this
          # repository's tags to tell a release that shipped from another line
          # from an entry nobody cut. On a tag push a checkout fetches the
          # triggering ref alone, so without this the job that publishes is the
          # one place the check cannot pass.
          fetch-tags: true
          # And the whole history, for the same reason ci.yml gives: one test
          # asks whether any commit that changed a rule file ever moved the
          # version, and a depth-1 checkout grafts its tip as a root commit.
          # That test used to read green on a shallow clone while answering
          # nothing; it refuses one now, and this job is where that refusal
          # first bit -- the release workflow runs on tags alone, so a change
          # to the gates cannot reach it until a tag is already pushed.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: "3.12"

      # Its own step, because the check below it is about a tag and this is
      # not: a dry run has no tag to agree with, and skipping the comparison
      # used to skip the install with it. `make check` then ran with no ruff.
      - name: install
        run: pip install -e ".[dev,shacl]"

      - name: the tag and the version agree
        if: github.event_name == 'push'
        run: |
          v="$(python -c 'import iirds_validate; print(iirds_validate.__version__)')"
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }

      - name: everything must be green first
        # The specification is not redistributable, so no runner has a
        # .spec-cache/ and the checks that hold docs/requirements.json to the
        # document can only run where somebody fetched one; pySHACL is
        # installed above, so the differential gate does run here.
        run: make check IIRDS_REQUIRE_SPEC_CACHE=

      - name: build the three distributions
        run: |
          pip install build
          python -m build --outdir dist/iirds .
          python -m build --outdir dist/iirds-validate shims/iirds-validate
          python -m build --outdir dist/iirds-sdk shims/iirds-sdk

      - name: no sdist carries working notes
        run: |
          for t in dist/*/*.tar.gz; do
            if tar tzf "$t" | sed -E 's#^[^/]+/##' \
               | grep -qE '^(CLAUDE\.md|AGENTS\.md|\.claude(/.*)?|docs/findings\.md|docs/audits\.md)$'; then
              echo "working notes in $t"; exit 1
            fi
            if tar tzf "$t" | grep -qE '^[^/]+/tests/'; then
              echo "tests in $t; the suite does not ship"; exit 1
            fi
          done

      - name: the compatibility names install beside the wheel and own no file of it
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet dist/iirds/*.whl
          /tmp/v/bin/pip install --quiet --no-index --find-links dist/iirds \
            --find-links dist/iirds-validate --find-links dist/iirds-sdk iirds-validate iirds-sdk
          /tmp/v/bin/pip check
          /tmp/v/bin/python tools/shim_overlap.py
          /tmp/v/bin/iirds --version && /tmp/v/bin/iirds-validate --version && /tmp/v/bin/iirdsv --version

      - name: build the .pyz twice on this runner; the hashes must match
        run: |
          python tools/build_zipapp.py -o dist/iirds.pyz --check
          python tools/build_zipapp.py -o /tmp/again.pyz
          cmp dist/iirds.pyz /tmp/again.pyz
          echo "this runner builds it the same twice"

      - name: bundle the SHACL shapes
        # The language-neutral encoding travels with every release, zipped
        # with its README and manifest so a SHACL user never needs this repo.
        run: |
          (cd shapes && zip -qr ../dist/iirds-shapes-1.3.zip .)

      - name: one directory, one checksum file
        run: |
          mv dist/iirds/* dist/iirds-validate/* dist/iirds-sdk/* dist/
          rmdir dist/iirds dist/iirds-validate dist/iirds-sdk
          cd dist && shasum -a 256 * > SHA256SUMS && cat SHA256SUMS

      # The publishers below upload exactly these bytes; nothing is rebuilt.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The permission that can move a release lives here, in a job that takes the
  # bytes the build job made and does one thing with them. Nothing is rebuilt:
  # a second build is a second set of bytes, and the checksum file beside them
  # would be describing the first.
  publish-release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131   # v7.0.0
        with:
          name: dist
          path: dist
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # `gh` finds the repository from `--repo`, then `GH_REPO`, then the
          # git remotes of the working directory. This job has no checkout, on
          # purpose -- putting this repository's own code back beside the one
          # permission that can move a release is what the split removed -- so
          # the name is given here. Measured outside a checkout: without it,
          # `failed to run git: fatal: not a git repository`.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md. Verify what you download: carry SHA256SUMS beside the file and ask it about that file, \`grep \" iirds.pyz$\" SHA256SUMS | shasum -a 256 -c -\` — \`-c\` on the whole file fails on the assets you did not take. The .pyz needs only a Python — \`python iirds.pyz your-package.iirds\`. On PyPI this release is \`iirds\`; \`iirds-validate\` and \`iirds-sdk\` are compatibility names that install it. Upgrading an environment that has \`iirds-validate\` 0.4.2 or earlier: \`pip uninstall -y iirds-validate\` first, then \`pip install -U iirds\`. If you already ran \`pip install -U iirds-validate\` and no command runs, \`pip install --force-reinstall --no-deps iirds\` restores it. Installs that began at 0.5.0 or later are unaffected."

  # Every `uses:` in this file names a commit, not a tag or a branch. The
  # publisher below runs in the job that holds `id-token: write` and uploads
  # under this project's name; `@release/v1` would have been whatever that
  # branch pointed at on the morning of a release, decided by somebody else
  # after this file was reviewed. The comment beside each pin is the version it
  # is, because the next person moving one needs to know what they are moving
  # from. `tests/test_workflow_supply_chain.py` refuses any ref that is not a
  # full commit; upgrades are made by hand, and no tool is given write access
  # to these lines. One consequence worth knowing: the publisher resolves to a
  # container image tagged with the same ref, so pinning it by commit pulls the
  # image tag named after that commit rather than the branch tag, which is
  # always republished.

  # Trusted Publishing (OIDC), one job and one GitHub environment per PyPI
  # project. `iirds` goes first: the other two declare `iirds>=<this version>`
  # and must not be resolvable before it is. Until pypi.org trusts this
  # repository for a project, that project's job fails visibly, on purpose,
  # without touching the GitHub Release above.
  publish-iirds:
    if: github.event_name == 'push'
    needs: publish-release
    runs-on: ubuntu-latest
    environment: pypi-iirds
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131   # v7.0.0
        with:
          name: dist
          path: dist
      - run: mkdir up && cp dist/iirds-[0-9]*.whl dist/iirds-[0-9]*.tar.gz up/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33   # v1.14.2
        with:
          packages-dir: up

  publish-iirds-validate:
    if: github.event_name == 'push'
    needs: publish-iirds
    runs-on: ubuntu-latest
    environment: pypi          # the publisher pypi.org already trusts for this project
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131   # v7.0.0
        with:
          name: dist
          path: dist
      - run: mkdir up && cp dist/iirds_validate-[0-9]*.whl dist/iirds_validate-[0-9]*.tar.gz up/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33   # v1.14.2
        with:
          packages-dir: up

  publish-iirds-sdk:
    if: github.event_name == 'push'
    needs: publish-iirds
    runs-on: ubuntu-latest
    environment: pypi-iirds-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131   # v7.0.0
        with:
          name: dist
          path: dist
      - run: mkdir up && cp dist/iirds_sdk-[0-9]*.whl dist/iirds_sdk-[0-9]*.tar.gz up/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33   # v1.14.2
        with:
          packages-dir: up
