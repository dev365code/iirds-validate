name: "iiRDS package check"
description: >
  Check iiRDS packages in a workflow. It installs the released checker from
  PyPI and runs it, or runs a single file you already have -- no socket opened
  while checking either way -- and the step returns the exit code the command
  line gives you.
author: "dev365code"
branding:
  icon: "check-square"
  color: "blue"

inputs:
  paths:
    description: >
      Packages to check: `.iirds` files, unpacked package directories, or
      directories to search. Several, separated by spaces; or one per line,
      which is the way to name a path with a space in it.
    required: true
  command:
    description: >
      Which judgement: `check` (conformance: the container and the metadata
      graph), `lint` (interoperability: can a consumer use it) or `all` (both).
      The command line's own verbs, and only those three: anything else is a
      usage error (64) before the checker is asked.
    required: false
    default: "check"
  version:
    description: >
      Which release to install and run. Left empty, it is the release of the ref
      this action is used at -- `@v1.2.3` runs 1.2.3 -- so the tag you pin is the
      release that runs; at a branch or a commit, the version that tree is
      numbered for.
    required: false
    default: ""
  pyz:
    description: >
      An `iirds.pyz` you already have. Given, this action installs nothing and
      fetches nothing, which is what a runner with no route to an index needs.
      (The job around it still reached GitHub to get here; that is the runner's
      doing, not this step's.)
    required: false
    default: ""
  sha256:
    description: >
      The SHA-256 that `pyz` must have, for a file carried into a closed network
      that somebody wants checked rather than trusted. The default path does not
      need it: `pip` checks what an index serves against the hashes the index
      publishes.
    required: false
    default: ""
  args:
    description: >
      Anything else to pass to the command, such as `-f json`, `-W` or
      `--fragment`. Split on spaces.
    required: false
    default: ""
  fail-on-finding:
    description: >
      Fail the step when the checker returns anything but 0. True by default,
      because a gate that stops nothing is decoration. Set it to false to have
      the step succeed and hand the code over in `exit-code` -- to report rather
      than to stop.
    required: false
    default: "true"

outputs:
  exit-code:
    description: >
      What the checker returned, in the command line's own codes: 0 clean, 1
      errors found (under `-W`, warnings too), 2 could not run -- a path naming
      nothing, a container that would not open -- and 64 a command line it
      refused. A failed step still publishes it, so with the default you need
      `continue-on-error: true` on the step to reach a line that reads it. The
      code is printed either way.
    value: ${{ steps.check.outputs.exit-code }}
  pyz:
    description: >
      The single file this step ran, when it ran one. Empty on the default path,
      which installs instead. Published so a caller can ask the file itself what
      version it is rather than trust that the right one was chosen.
    value: ${{ steps.check.outputs.pyz }}
  version:
    description: >
      The version this step decided to install -- from `version`, from the ref
      you pinned, or from the tree the action came from -- because which
      checker ran is the question a verdict is only meaningful against. Empty
      when `pyz` is given: nothing was installed, and the file answers
      `--version` itself.
    value: ${{ steps.obtain.outputs.version }}

runs:
  using: "composite"
  steps:
    # The only step that reaches an index, and only when it has not been handed
    # a file. It installs the released distribution rather than downloading a
    # release asset: an asset is attached by a person and a person can forget,
    # while publishing to the index is what the release workflow does by
    # itself. The check opens no socket for any input -- that is the tool's
    # promise and its own test, not this action's.
    - id: obtain
      if: inputs.pyz == ''
      shell: bash
      env:
        WANTED: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        PY=$(command -v python3 || command -v python || true)
        if [ -z "$PY" ]; then
          echo "::error::no python on PATH. Add actions/setup-python before this step, or put one there."
          exit 64
        fi

        version="$WANTED"
        # The ref the caller wrote, when it is a release: this repository tags
        # each release `v` and its version.
        if [ -z "$version" ]; then
          case "$ACTION_REF" in
            v[0-9]*) version="${ACTION_REF#v}" ;;
          esac
        fi
        # A branch, a commit, or `./`: the version this tree is numbered for.
        if [ -z "$version" ]; then
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$ACTION_PATH/pyproject.toml" | head -1)
        fi
        if [ -z "$version" ]; then
          echo "::error::cannot tell which version to run, and guessing one would run a checker nobody asked for"
          exit 64
        fi

        # Named for the version: `pip install --target` into a directory that
        # already holds a release leaves that release there, so a second use of
        # this action in one job, asking for another version, would run the
        # first. `--target` leaves the caller's environment as it was found;
        # `--only-binary :all:` builds nothing on a machine this action does
        # not own.
        target="${RUNNER_TEMP:-/tmp}/iirds-$version"
        "$PY" -m pip install --disable-pip-version-check --no-input \
          --only-binary :all: --target "$target" "iirds==$version"
        echo "target=$target" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - id: check
      shell: bash
      env:
        PYZ: ${{ inputs.pyz }}
        WANT_SHA: ${{ inputs.sha256 }}
        TARGET: ${{ steps.obtain.outputs.target }}
        COMMAND: ${{ inputs.command }}
        PATHS: ${{ inputs.paths }}
        EXTRA: ${{ inputs.args }}
        FAIL_ON_FINDING: ${{ inputs.fail-on-finding }}
      run: |
        set -uo pipefail
        PY=$(command -v python3 || command -v python || true)
        if [ -z "$PY" ]; then
          echo "::error::no python on PATH. Add actions/setup-python before this step, or put one there."
          exit 64
        fi

        # The verbs that judge a package, and no other word. The command line
        # reads a first word that is not a verb as a path, so a misspelt
        # `command:` would come back as 2, "could not run", about a package
        # nobody named.
        case "$COMMAND" in
          check|lint|all) ;;
          *)
            echo "::error::command must be check, lint or all, not [$COMMAND]"
            exit 64
            ;;
        esac

        # Two ways in, one invocation: the single file when you carried one --
        # and then its hash, if you asked for that -- and the installed
        # distribution otherwise. Nothing after this knows which door was used.
        if [ -n "$PYZ" ]; then
          if [ ! -f "$PYZ" ]; then
            echo "::error::no checker to run at [$PYZ]. Give pyz: a file that exists, or leave it empty to install one."
            exit 64
          fi
          if [ -n "$WANT_SHA" ]; then
            # From standard input, so the line names no file. Handed a name with
            # a backslash in it -- every path on a Windows runner -- GNU
            # sha256sum and shasum both escape the name and put a backslash
            # before the hash, and the right file was then refused.
            if command -v sha256sum >/dev/null 2>&1; then
              got=$(sha256sum < "$PYZ" | cut -d" " -f1)
            else
              got=$(shasum -a 256 < "$PYZ" | cut -d" " -f1)
            fi
            want=$(printf '%s' "$WANT_SHA" | tr 'A-Z' 'a-z' | tr -d '[:space:]')
            got=$(printf '%s' "$got" | tr 'A-Z' 'a-z')
            if [ "$got" != "$want" ]; then
              echo "::error::[$PYZ] hashes to $got and you asked for $want"
              exit 64
            fi
          fi
          set -- "$PY" "$PYZ" "$COMMAND"
        else
          # The checker itself, not only a directory: `python -m` on a module
          # that is not there exits 1, which is the code for "errors found".
          if [ -z "${TARGET:-}" ] || [ ! -f "$TARGET/iirds_validate/__main__.py" ]; then
            echo "::error::nothing was installed to run. The install step did not leave the checker behind."
            exit 64
          fi
          export PYTHONPATH="$TARGET"
          set -- "$PY" -m iirds_validate "$COMMAND"
        fi

        # The argument list, built by hand. `paths` written as a YAML block is
        # one package per line, which is the only way to name a file whose
        # directory has a space in it; written on one line it is space
        # separated, the way the input says.
        newline=$(printf '\nx'); newline=${newline%x}
        old_ifs=$IFS
        set -f                          # `a[1].iirds` is a file, not a pattern,
                                        # and `*.iirds` is not this action's to
                                        # expand
        IFS=' '
        # shellcheck disable=SC2086
        set -- "$@" $EXTRA
        case $PATHS in
          *"$newline"*) IFS=$newline ;;
          *)            IFS=' ' ;;
        esac
        # shellcheck disable=SC2086
        set -- "$@" $PATHS
        IFS=$old_ifs
        set +f

        # `|| rc=$?`, not a bare call and `$?` after it. GitHub runs `shell:
        # bash` as `bash --noprofile --norc -e -o pipefail`, so errexit is on
        # before this script says anything: a bare call that exits non-zero
        # ends the step there, and the output, the branch and the message
        # below never happen. `set -uo pipefail` above does not turn `-e` off.
        rc=0
        "$@" || rc=$?

        # Only the codes the command line defines are verdicts. 127 is "no
        # such program" and 126 "not executable"; reported as a verdict they
        # would say a package has errors when nothing looked at one -- and in
        # report mode the step would go green over a run that never happened.
        case "$rc" in
          0|1|2|64) ;;
          *)
            echo "::error::the checker did not run (exit $rc); this is not a verdict on any package"
            exit "$rc"
            ;;
        esac
        # Written before either branch: on the failing one GitHub still
        # publishes this, and the line is what the log has either way.
        echo "exit-code=$rc" >> "$GITHUB_OUTPUT"
        echo "pyz=$PYZ" >> "$GITHUB_OUTPUT"
        # `tr`, not bash 4's `${x,,}`: macOS runners still ship bash 3.2.
        if [ "$(printf '%s' "$FAIL_ON_FINDING" | tr '[:upper:]' '[:lower:]')" = "false" ]; then
          echo "iirds returned $rc; the step is not failing because fail-on-finding is false"
          exit 0
        fi
        # The code, not a flattened failure: a job that cannot tell 64 from 1
        # cannot tell its own typo from somebody's package.
        exit "$rc"
