<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 399" role="img" aria-label="Real output of iirds check on a broken package: two errors, each with evidence and a fix">
<rect x="1" y="1" width="938" height="397" rx="10" fill="#12161a" stroke="#252b30" stroke-width="1.5"/>
<circle cx="24" cy="19" r="5" fill="#e0604d"/><circle cx="42" cy="19" r="5" fill="#e8c268"/><circle cx="60" cy="19" r="5" fill="#5cb87f"/>
<text x="80" y="23" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#7d8a99">iirds check — real output, colour added</text>
<text y="40" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="28" fill="#8fd0a8" font-weight="700">$ </tspan><tspan x="46" fill="#d8dfe5">pip install iirds</tspan></text><text y="61" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="28" fill="#8fd0a8" font-weight="700">$ </tspan><tspan x="46" fill="#d8dfe5">iirds check broken.iirds</tspan></text><text y="91" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="28" fill="#d8dfe5" font-weight="700">broken.iirds   </tspan><tspan x="140" fill="#e8c268">iiRDS not declared</tspan></text><text y="111" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="40" fill="#93a1ad">note: no iirds:iiRDSVersion in the package; validated against 1.3.</tspan></text><text y="128" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="40" fill="#93a1ad">note: metadata read from META-INF/metadata.rdf</tspan></text><text y="155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="40" fill="#e0604d" font-weight="700">ERROR </tspan><tspan x="90" fill="#e8c268" font-weight="700">M3</tspan><tspan x="140" fill="#d8dfe5">metadata declares no iirds:Package for this container</tspan></text><text y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="154" fill="#5cb87f">→ Provide exactly one iirds:Package instance describing this container. It</tspan></text><text y="191" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="154" fill="#5cb87f">→ is the root a consumer starts from, so zero leaves the package</tspan></text><text y="208" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="154" fill="#5cb87f">→ unidentified and two leave it ambiguous.</tspan></text><text y="232" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="40" fill="#e0604d" font-weight="700">ERROR </tspan><tspan x="90" fill="#e8c268" font-weight="700">C5</tspan><tspan x="140" fill="#d8dfe5">mimetype must contain exactly 'application/iirds+zip' with no line ending</tspan></text><text y="251" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="168" fill="#7d8a99">mimetype</tspan></text><text y="268" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="168" fill="#7d8a99">b'application/zip'</tspan></text><text y="287" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="154" fill="#5cb87f">→ Make the file contain exactly application/iirds+zip, ASCII, with no</tspan></text><text y="304" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="154" fill="#5cb87f">→ trailing newline and no byte order mark. Editors add both silently, so</tspan></text><text y="321" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="154" fill="#5cb87f">→ write it with a tool that does not.</tspan></text><text y="348" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="28" fill="#e0604d" font-weight="700">FAIL</tspan><tspan x="90" fill="#d8dfe5">2 error(s), 0 warning(s), 0 informational</tspan></text><text y="367" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan x="28" fill="#93a1ad">175 rules checked, 24 not applicable to this version/variant</tspan></text>
</svg>