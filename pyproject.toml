[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "iirds-validate"
version = "0.1.0"
description = "Offline, graph-based validator and interoperability linter for iiRDS packages"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
# Apache-2.0 covers this project's own code. The bundled iiRDS ontologies stay
# under CC BY-ND 4.0 and the rule catalogue under MIT; see NOTICE, which ships
# in the wheel alongside them. docs/licensing.md explains what that means.
keywords = ["iirds", "tekom", "rdf", "validation", "technical-documentation", "vdi2770"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: XML",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["rdflib>=6.0"]

[project.urls]
Homepage = "https://github.com/dev365code/iirds-validate"
Source = "https://github.com/dev365code/iirds-validate"
Issues = "https://github.com/dev365code/iirds-validate/issues"
Changelog = "https://github.com/dev365code/iirds-validate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff==0.16.3"]
shacl = ["pyshacl==0.40.*"]   # differential gate only, pinned to the tested minor; runtime stays rdflib-only

[project.scripts]
iirds-validate = "iirds_validate.cli:main"
iirdsv = "iirds_validate.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iirds_validate = ["py.typed", "data/*.json", "data/ontologies/*.txt", "data/ontologies/*.md", "data/ontologies/*/*.rdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "UP006", "UP007", "UP035", "UP045",  # py39 target: keep typing.List / Optional
    "UP031",                    # %-formatting is fine; rewriting 58 sites is churn
    "B905",                     # zip(strict=) is 3.10+
    "E501",                     # line length is checked by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]   # sys.path must be set before the tools import
