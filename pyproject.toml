[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "iirds-validate"
version = "0.1.0"
description = "Offline, graph-based validator and interoperability linter for iiRDS packages"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["iirds", "tekom", "rdf", "validation", "technical-documentation", "vdi2770"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = ["rdflib>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
iirds-validate = "iirds_validate.cli:main"
iirdsv = "iirds_validate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iirds_validate = ["data/*.json", "data/ontologies/*.txt", "data/ontologies/*.md", "data/ontologies/*/*.rdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
