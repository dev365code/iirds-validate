[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iirds"
version = "0.5.0"
description = "Validate, lint, pack and serve iiRDS packages from the command line; read and write them from Python. Offline, graph-based. Held in stewardship for the iiRDS ecosystem."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md"]
authors = [{ name = "Wooyong Lee", email = "zero8004paz@gmail.com" }]
# Apache-2.0 covers this project's own code, the checker and the read/write
# library alike. The bundled iiRDS ontologies stay
# under CC BY-ND 4.0 and the rule catalogue under MIT; see NOTICE, which ships
# in the wheel alongside them. docs/licensing.md explains what that means.
keywords = ["iirds", "tekom", "rdf", "validation", "technical-documentation", "intelligent-information", "vdi2770"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Markup :: XML",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# One runtime dependency. tests/library/test_dependencies.py holds the library
# half of the tree to exactly this line, and tools/build_zipapp.py bundles what
# it says.
dependencies = ["rdflib>=6"]

[project.urls]
Homepage = "https://github.com/dev365code/iirds-validate"
Source = "https://github.com/dev365code/iirds-validate"
Issues = "https://github.com/dev365code/iirds-validate/issues"
Changelog = "https://github.com/dev365code/iirds-validate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff==0.16.3"]
shacl = ["pyshacl==0.40.*"]   # differential gate only, pinned to the tested minor; runtime stays rdflib-only

[project.scripts]
# One command, three names. `iirds` is the name; the other two are what the
# checker was called before it and the library shipped as one distribution.
iirds = "iirds_validate.cli:main"
iirds-validate = "iirds_validate.cli:main"
iirdsv = "iirds_validate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iirds_validate = ["py.typed", "data/*.json", "data/web/*", "data/ontologies/*.txt", "data/ontologies/*.md", "data/ontologies/*/*.rdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
# --strict-markers so a typo in a mark is an error rather than a mark nobody
# applies; --strict-config so a typo in this table is too. xfail_strict so an
# expected failure that starts passing is reported instead of quietly logged.
addopts = "--strict-markers --strict-config"
xfail_strict = true
# A warning raised by this project's own code is a failure. The one exception
# is rdflib's own deprecation schedule, which this project does not control:
# its JSON-LD parser builds a ConjunctiveGraph on every parse and warns about
# it, and nothing here constructs one. Scoped to where the warning comes from
# rather than to its wording, so a dependency rephrasing its own message does
# not turn this suite red, while a deprecation raised anywhere else still does.
filterwarnings = [
    "error",
    "default::DeprecationWarning:rdflib(\\.|$)",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "UP006", "UP007", "UP035", "UP045",  # py39 target: keep typing.List / Optional
    "UP031",                    # %-formatting is fine; rewriting 58 sites is churn
    "B905",                     # zip(strict=) is 3.10+
    "E501",                     # line length is checked by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]   # sys.path must be set before the tools import
