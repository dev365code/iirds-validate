<!doctype html>
<meta charset="utf-8">
<title>iiRDS package check</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
         margin: 0 auto; max-width: 52rem; padding: 2rem 1rem 4rem; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 .25rem; }
  p.sub { margin: 0 0 1.5rem; opacity: .7; }
  #drop { border: 2px dashed currentColor; border-radius: .5rem; opacity: .55;
          padding: 3rem 1rem; text-align: center; cursor: pointer; }
  #drop.over { opacity: 1; }
  pre { background: rgba(127,127,127,.12); border-radius: .4rem; overflow-x: auto;
        padding: 1rem; white-space: pre; }
  button { font: inherit; padding: .4rem .8rem; }
  footer { margin-top: 2.5rem; opacity: .6; font-size: .85rem; }
  @media print { #drop, button, footer { display: none } }
</style>

<h1>iiRDS package check</h1>
<p class="sub">Drop a <code>.iirds</code> file. It is read by the process that
served this page and is not sent anywhere else.</p>

<div id="drop" tabindex="0">drop a package here, or click to choose one
  <input id="file" type="file" accept=".iirds,.zip" hidden></div>

<pre id="out" hidden></pre>
<p><button id="save" hidden>download the report as JSON</button></p>

<footer>iirds-validate __VERSION__ &middot; this page is served on the loopback
interface and closes when you stop the command.</footer>

<script>
(function () {
  var drop = document.getElementById("drop");
  var file = document.getElementById("file");
  var out = document.getElementById("out");
  var save = document.getElementById("save");
  var latest = null;

  function show(text) { out.hidden = false; out.textContent = text; }

  function send(chosen) {
    if (!chosen) { return; }
    show("checking " + chosen.name + "…");
    save.hidden = true;
    var body = new FormData();
    body.append("package", chosen, chosen.name);
    fetch("/check", { method: "POST", body: body })
      .then(function (r) { return r.json(); })
      .then(function (payload) {
        show(payload.text);
        latest = payload.report;
        save.hidden = latest === null;
        document.title = (payload.exit === 0 ? "PASS" : "FAIL") + " — " + chosen.name;
      })
      .catch(function (err) { show("the page could not reach the checker: " + err); });
  }

  drop.addEventListener("click", function () { file.click(); });
  drop.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); file.click(); }
  });
  file.addEventListener("change", function () { send(file.files[0]); });
  ["dragenter", "dragover"].forEach(function (name) {
    drop.addEventListener(name, function (e) { e.preventDefault(); drop.classList.add("over"); });
  });
  ["dragleave", "drop"].forEach(function (name) {
    drop.addEventListener(name, function (e) { e.preventDefault(); drop.classList.remove("over"); });
  });
  drop.addEventListener("drop", function (e) { send(e.dataTransfer.files[0]); });

  save.addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(latest, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "iirds-report.json"; a.click();
    URL.revokeObjectURL(url);
  });
})();
</script>
